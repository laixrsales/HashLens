navigation = "2.10.2"
room = "2.8.5"
camerax = "1.6.2"
work = "2.12.0"
exifinterface = "1.4.2"
# 4.x mais recente: o hashing-spec v1 foi escrito sobre OpenCV 4 (R9/R10); migrar para 5.x exige revalidar os golden.
opencv = "4.14.0"
# ⚠️ R2: 5.x e 6.x são compilados para Java 21 sem variante Android; 4.12.3-android é a última variante Android oficial.
web3j = "4.12.3-android"
# ⚠️ R1
reownBom = "1.6.17"
