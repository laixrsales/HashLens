# Versões estáveis conferidas em 2026-10-05 (Google Maven / Maven Central).
# Itens ⚠️ do research: Reown AppKit (R1), web3j (R2), Roborazzi (R21).

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coroutines = "1.11.0"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
